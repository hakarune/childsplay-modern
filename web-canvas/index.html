<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2333" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Childsplay" />
  <title>Childsplay</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- touch-friendly overlay: a Back button + the current game's name.
         Hidden on the dashboard, shown inside a game. -->
    <header id="hud" hidden>
      <button id="back-btn" type="button" aria-label="Back to the menu">&larr; Menu</button>
      <span id="activity-name"></span>
    </header>

    <!-- always-available chrome (top-right): theme, mute, fullscreen -->
    <div id="chrome">
      <button id="theme-btn" type="button" aria-label="Toggle light/dark" title="Light / dark">&#x263D;</button>
      <button id="mute-btn" type="button" aria-label="Sound options" title="Sound">&#x1F50A;</button>
      <button id="fs-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen">&#x26F6;</button>
      <div id="mute-pop" hidden>
        <label><input type="checkbox" data-ch="music" /> Music</label>
        <label><input type="checkbox" data-ch="sfx" /> Sound effects</label>
        <label><input type="checkbox" data-ch="voice" /> Voice</label>
      </div>
    </div>

    <!-- one dynamic canvas; engine.js flexes the world to the viewport in
         landscape and fits a fixed 16:9 to the width in portrait. -->
    <canvas id="game-canvas" width="1280" height="720"
            role="img" aria-label="Childsplay game canvas">
      This game needs a browser with HTML5 Canvas support.
    </canvas>

    <div id="splash" aria-hidden="true"><span>Childsplay</span></div>

    <noscript><p class="fallback">Childsplay needs JavaScript enabled.</p></noscript>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    // Register the service worker so the site installs as an offline app.
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

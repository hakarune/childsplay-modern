<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2333" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Childsplay" />
  <title>Childsplay</title>
  <link rel="icon" href="assets/icons/memory.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- touch-friendly overlay: a Back button + the current game's name.
         Hidden on the dashboard, shown inside a game. -->
    <header id="hud" hidden>
      <button id="back-btn" type="button" aria-label="Back to the menu">&larr; Menu</button>
      <span id="activity-name"></span>
    </header>

    <!-- always-available fullscreen toggle (top-right) -->
    <button id="fs-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen">&#x26F6;</button>

    <!-- one dynamic canvas; engine.js flexes the world to the viewport in
         landscape and fits a fixed 16:9 to the width in portrait. -->
    <canvas id="game-canvas" width="1280" height="720"
            role="img" aria-label="Childsplay game canvas">
      This game needs a browser with HTML5 Canvas support.
    </canvas>

    <div id="splash" aria-hidden="true"><span>Childsplay</span></div>

    <noscript><p class="fallback">Childsplay needs JavaScript enabled.</p></noscript>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
